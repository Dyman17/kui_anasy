<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 80" width="32" height="80">
  <defs>
    <style>
      .orn-line { fill: none; stroke: #c29b38; stroke-linecap: round; stroke-linejoin: round; }
      .orn-fill { fill: #c29b38; }
    </style>
  </defs>

  <!-- Left & right subtle framing edge guides -->
  <line x1="1.5" y1="0" x2="1.5" y2="80" stroke="#c29b38" stroke-width="1.2" opacity="0.3"/>
  <line x1="30.5" y1="0" x2="30.5" y2="80" stroke="#c29b38" stroke-width="1.2" opacity="0.3"/>
  <line x1="4.5" y1="0" x2="4.5" y2="80" stroke="#c29b38" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.2"/>
  <line x1="27.5" y1="0" x2="27.5" y2="80" stroke="#c29b38" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.2"/>

  <!-- Center spine dashed line -->
  <line x1="16" y1="0" x2="16" y2="80" stroke="#c29b38" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.15"/>

  <!-- Top junction connecting node at y=0 / y=80 -->
  <circle cx="16" cy="0" r="2.5" class="orn-fill" opacity="0.5"/>
  <circle cx="16" cy="80" r="2.5" class="orn-fill" opacity="0.5"/>
  <path d="M16 0 L16 10 C12.5 13 8 11.5 6.5 7.5" class="orn-line" stroke-width="1.3" opacity="0.45"/>
  <path d="M16 0 L16 10 C19.5 13 24 11.5 25.5 7.5" class="orn-line" stroke-width="1.3" opacity="0.45"/>
  <path d="M16 80 L16 70 C12.5 67 8 68.5 6.5 72.5" class="orn-line" stroke-width="1.3" opacity="0.45"/>
  <path d="M16 80 L16 70 C19.5 67 24 68.5 25.5 72.5" class="orn-line" stroke-width="1.3" opacity="0.45"/>

  <!-- Central Tumar (Diamond) -->
  <polygon points="16,28 25,40 16,52 7,40" stroke="#c29b38" stroke-width="1.5" fill="#c29b38" fill-opacity="0.12"/>
  <circle cx="16" cy="40" r="2.8" class="orn-fill" opacity="0.7"/>

  <!-- Upper Kazakh Qoshqar Muyiz (Ram's horn spiral) -->
  <path d="M16 28 C13 17 6.5 15 6.5 22.5 C6.5 28 12 28.5 12.8 24.5 C13.3 22 10.5 20.5 8.5 22" class="orn-line" stroke-width="1.6" opacity="0.75"/>
  <path d="M16 28 C19 17 25.5 15 25.5 22.5 C25.5 28 20 28.5 19.2 24.5 C18.7 22 21.5 20.5 23.5 22" class="orn-line" stroke-width="1.6" opacity="0.75"/>

  <!-- Lower Kazakh Qoshqar Muyiz (Inverted Ram's horn spiral) -->
  <path d="M16 52 C13 63 6.5 65 6.5 57.5 C6.5 52 12 51.5 12.8 55.5 C13.3 58 10.5 59.5 8.5 58" class="orn-line" stroke-width="1.6" opacity="0.75"/>
  <path d="M16 52 C19 63 25.5 65 25.5 57.5 C25.5 52 20 51.5 19.2 55.5 C18.7 58 21.5 59.5 23.5 58" class="orn-line" stroke-width="1.6" opacity="0.75"/>

  <!-- Accent diamond dots inside the horns -->
  <polygon points="16,16 18,19 16,22 14,19" class="orn-fill" opacity="0.45"/>
  <polygon points="16,58 18,61 16,64 14,61" class="orn-fill" opacity="0.45"/>
</svg>
