<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- 18-19th century Traditional Kazakh Leather Torsyk (Торсық) Contour -->
  <g stroke="#a34836" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Stopper & Neck (Тығыны мен мойны) -->
    <path d="M92 12 h16 v22 h-16 z"/>
    <path d="M88 34 h24 v8 h-24 z"/>
    <!-- Hanging leather loops (Бауы) -->
    <path d="M88 38 C75 36, 68 45, 70 60 L76 100" stroke-width="1.6"/>
    <path d="M112 38 C125 36, 132 45, 130 60 L124 100" stroke-width="1.6"/>

    <!-- Torsyk Horns (Торсықтың мүйіз тәрізді қос иіні) -->
    <path d="M86 42 C68 46, 30 70, 24 110 C18 145, 38 175, 68 180 C84 182, 92 195, 94 216" stroke-width="2.8"/>
    <path d="M114 42 C132 46, 170 70, 176 110 C182 145, 162 175, 132 180 C116 182, 108 195, 106 216" stroke-width="2.8"/>

    <!-- Bottom Round Base (Түбі) -->
    <path d="M94 216 C96 226, 104 226, 106 216" stroke-width="2.8"/>

    <!-- Inner Embossed Kazakh Ornament (Былғарыға бедерленген ою-өрнек) -->
    <!-- Central Tumar medallion -->
    <polygon points="100,85 116,108 100,130 84,108" stroke-width="1.8" stroke-dasharray="3 3"/>
    <circle cx="100" cy="108" r="4" fill="#a34836"/>
    
    <!-- Horn curls embossed on sides -->
    <path d="M60 110 C50 95, 35 105, 42 120 C48 132, 60 126, 58 118" stroke-width="1.8"/>
    <path d="M140 110 C150 95, 165 105, 158 120 C152 132, 140 126, 142 118" stroke-width="1.8"/>
  </g>
</svg>

