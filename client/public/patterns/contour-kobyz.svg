<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 480" fill="none">
  <!-- 18-19th century Traditional Kazakh Kyl-Kobyz Contour -->
  <g stroke="#a34836" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Curved Headstock (Басы) with ancient spiral horn curl (Қошқар мүйіз) -->
    <path d="M100 24 C85 24, 70 34, 70 50 C70 66, 85 76, 100 76 C115 76, 126 64, 126 50 C126 38, 116 30, 106 30 C96 30, 90 38, 92 46"/>
    <!-- Traditional mirror / charm aperture (Айналық / Тұмар орны) -->
    <circle cx="100" cy="52" r="7" stroke-width="1.8"/>

    <!-- Wooden tuning pegs (Құлақтары) -->
    <line x1="62" y1="50" x2="74" y2="50" stroke-width="2.5"/>
    <circle cx="58" cy="50" r="4" fill="#a34836"/>
    <line x1="124" y1="50" x2="136" y2="50" stroke-width="2.5"/>
    <circle cx="140" cy="50" r="4" fill="#a34836"/>

    <!-- Thick hollow curved Neck (Иілген мойны) -->
    <path d="M88 76 L86 190 M112 76 L114 190"/>
    <path d="M96 110 C96 140, 104 140, 104 110" stroke-width="1.2"/>

    <!-- Resonator Body (Шанағы) - Characteristic Double-chamber ladle shape -->
    <!-- Upper open sound cup (Жоғарғы ашық бөлігі) -->
    <path d="M86 190 C60 200, 36 225, 36 270 C36 315, 65 330, 80 340 M114 190 C140 200, 164 225, 164 270 C164 315, 135 330, 120 340" stroke-width="2.8"/>
    
    <!-- Waist indentation (Белі) -->
    <path d="M80 340 C72 346, 68 356, 68 370 M120 340 C128 346, 132 356, 132 370"/>

    <!-- Lower skin-covered basin (Төменгі көн қапталған бөлігі) -->
    <path d="M68 370 C68 420, 80 460, 100 462 C120 460, 132 420, 132 370" stroke-width="2.8"/>
    <!-- Camel skin diaphragm rim line (Түйе көні жиегі) -->
    <ellipse cx="100" cy="370" rx="32" ry="14" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- High curved Horsehair Bridge (Тиек) -->
    <path d="M86 405 C94 395, 106 395, 114 405" stroke-width="2.5"/>
    <line x1="86" y1="405" x2="86" y2="415"/>
    <line x1="114" y1="405" x2="114" y2="415"/>

    <!-- Horsehair Strings (Қыл ішектер - жуан және жіңішке қыл) -->
    <line x1="95" y1="52" x2="95" y2="455" stroke-width="1.8"/>
    <line x1="105" y1="52" x2="105" y2="455" stroke-width="2.4"/>

    <!-- Metal jingles / rattles inside headstock (Қоңыраушалар) -->
    <circle cx="86" cy="140" r="3" fill="#a34836" fill-opacity="0.6"/>
    <circle cx="114" cy="140" r="3" fill="#a34836" fill-opacity="0.6"/>
  </g>
</svg>
